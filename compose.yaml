services:
  game-server:
    build:
      context: .
    image: box-godot-server:local
    command: ["--server", "--server-port=${GAME_SERVER_PORT:-27015}", "${GAME_SERVER_TEST_MODE:---production}", "${GAME_SERVER_CITY_MODE:---procedural-city}", "${GAME_SERVER_GAME_MODE:---survival}", "${GAME_SERVER_PVP_BOTS:---pvp-bots=0}"]
    environment:
      GAME_SERVER_WORLD_SEED: "${GAME_SERVER_WORLD_SEED:-}"
    restart: unless-stopped
    ports:
      - "${GAME_SERVER_PORT:-27015}:${GAME_SERVER_PORT:-27015}/udp"
      - "${GAME_SERVER_DISCOVERY_PORT:-27016}:${GAME_SERVER_DISCOVERY_PORT:-27016}/udp"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/godot/.local/share/godot:size=64m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
