# GDScript Linter - configuracao do dock do editor.
# Os limites seguem o AGENTS.md do projeto: funcao ate 80 linhas,
# arquivo ate 500 linhas, no maximo 2 niveis de indentacao.
# O CLI (analyzers) le gdlint.json; mantenha os dois em sincronia.

[limits]
file_lines_soft = 500
file_lines_hard = 800
function_lines = 80
function_lines_critical = 120
max_parameters = 5
max_nesting = 2
max_line_length = 120
cyclomatic_warning = 12
cyclomatic_critical = 20
god_class_functions = 20
god_class_signals = 10

[checks]
file_length = true
function_length = true
cyclomatic_complexity = true
parameters = true
nesting = true
todo_comments = true
empty_functions = true
god_class = true
naming_conventions = true
unused_variables = true
strict_limits = true
sealed = true
# Checks desligados no inicio para nao afogar o baseline; religue conforme
# o debito for sendo pago.
print_statements = false
magic_numbers = false
commented_code = false
missing_types = false
missing_return_type = false
unused_parameters = false
ascii_only = false
ascii_only_project_wide = false
# O AGENTS.md prioriza estrutura clara sobre linhas curtas.
long_lines = false

[scanning]
scan_addons = false
respect_gdignore = true

[exclude]
paths = addons/, .godot/, screenshots/
