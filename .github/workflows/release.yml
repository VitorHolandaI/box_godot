name: release

# Gera os clientes Linux/Windows/macOS e publica a Release.
#
# Tres gatilhos:
#   - workflow_call: chamado pelo tag-release.yml quando o GAME_BUILD muda na main;
#   - workflow_dispatch: na mao, em Actions -> release -> Run workflow;
#   - push de tag build-*: quando alguem cria a tag do proprio terminal.
#
# O tag-release precisa CHAMAR este workflow em vez de so empurrar a tag, porque
# tag empurrada com o GITHUB_TOKEN nao dispara outro workflow (protecao do
# GitHub contra workflow recursivo).
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag da release, por exemplo build-2026-09-18"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release, por exemplo build-2026-09-18"
        required: true
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

jobs:
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2 e os templates oficiais
        run: |
          set -euo pipefail
          VERSION=4.7.2
          mkdir -p "$HOME/godot"
          curl -fsSL -o "$HOME/godot/editor.zip" \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q -o "$HOME/godot/editor.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${VERSION}-stable_linux.x86_64"
          sudo ln -sf "$HOME/godot/Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          TEMPLATES="$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          mkdir -p "$TEMPLATES"
          # O pacote oficial tem mais de 1 GB: baixa so os 3 trechos necessarios.
          python3 scripts/fetch_macos_template.py --version "$VERSION" \
            --entry templates/linux_release.x86_64 --output "$TEMPLATES/linux_release.x86_64"
          python3 scripts/fetch_macos_template.py --version "$VERSION" \
            --entry templates/windows_release_x86_64.exe --output "$TEMPLATES/windows_release_x86_64.exe"
          python3 scripts/fetch_macos_template.py --version "$VERSION" --output "$TEMPLATES/macos.zip"
          printf '%s.stable' "$VERSION" > "$TEMPLATES/version.txt"
          ls -la "$TEMPLATES"

      - name: Importar assets (checkout limpo nao tem o cache .godot)
        run: godot --headless --path . --import

      - name: Gerar os 3 exports
        run: bash scripts/build_exports.sh

      - name: Guardar como artefato do run
        uses: actions/upload-artifact@v4
        with:
          name: box-godot-export
          path: |
            dist/box-godot-linux.x86_64
            dist/box-godot-windows.exe
            dist/box-godot-macos.zip
            dist/SHA256SUMS

      - name: Publicar ou atualizar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          echo "tag: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Box Godot $TAG" \
                 --notes "Clientes Linux, Windows e macOS gerados pelo Actions."
          gh release upload "$TAG" \
            dist/box-godot-linux.x86_64 dist/box-godot-windows.exe \
            dist/box-godot-macos.zip dist/SHA256SUMS --clobber

      - name: Resumo
        run: cat dist/SHA256SUMS
