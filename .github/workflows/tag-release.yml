name: tag-release

# Todo push na main gera os binarios. A Release usada e a do GAME_BUILD
# declarado em scripts/build_info.gd: a tag nasce na primeira vez que aquele
# build chega na main, e os pushes seguintes com o mesmo build so trocam os
# arquivos da Release (o release.yml sobe com --clobber).
#
# Por que amarrar no GAME_BUILD e nao no commit: ele e o identificador que o
# servidor compara no handshake, entao ele e quem define o que e uma versao
# diferente para quem joga. Uma tag por commit encheria o repo de tags que nao
# significam nada para o jogador.
#
# A tag sai daqui com o GITHUB_TOKEN, e tag empurrada com esse token NAO dispara
# outro workflow (protecao do GitHub contra workflow recursivo). Por isso o
# release e CHAMADO como workflow_call em vez de esperar o gatilho de push da
# tag.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  decidir:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calcular.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # O historico inteiro, senao o rev-parse nao enxerga as tags antigas e
          # toda entrega na main pareceria uma versao nova.
          fetch-depth: 0

      - name: Garantir a tag do build declarado
        id: calcular
        run: |
          set -euo pipefail
          BUILD="$(sed -n 's/^const GAME_BUILD := "\(.*\)"$/\1/p' scripts/build_info.gd)"
          if [ -z "$BUILD" ]; then
            echo "GAME_BUILD nao encontrado em scripts/build_info.gd; esperado 'const GAME_BUILD := \"AAAA-MM-DD.N\"'." >&2
            exit 1
          fi
          TAG="build-$BUILD"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo ">> $TAG ja existe; a Release dela vai receber os binarios novos"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo ">> $TAG criada"

  publicar:
    needs: decidir
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.decidir.outputs.tag }}
