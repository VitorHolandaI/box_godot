name: tag-release

# Toda entrega na main vira release? Nao. So quando o GAME_BUILD muda.
#
# O GAME_BUILD ja e o identificador que o servidor compara no handshake: cliente
# com build diferente do servidor e recusado. Entao ele, e nao o commit, e quem
# define o que e uma versao nova de verdade. Correcao de typo entra na main sem
# gerar tres binarios de ~90 MB; mudanca que altera o build gera a release
# sozinha.
#
# A tag sai daqui com o GITHUB_TOKEN, e tag empurrada com esse token NAO dispara
# outro workflow (protecao contra workflow recursivo). Por isso o release e
# CHAMADO como workflow_call em vez de esperar o gatilho de push da tag.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  decidir:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calcular.outputs.tag }}
      nova: ${{ steps.calcular.outputs.nova }}
    steps:
      - uses: actions/checkout@v4
        with:
          # O historico inteiro, senao o rev-parse nao enxerga as tags antigas e
          # toda entrega na main pareceria uma versao nova.
          fetch-depth: 0

      - name: Decidir se ha versao nova
        id: calcular
        run: |
          set -euo pipefail
          BUILD="$(sed -n 's/^const GAME_BUILD := "\(.*\)"$/\1/p' scripts/build_info.gd)"
          if [ -z "$BUILD" ]; then
            echo "GAME_BUILD nao encontrado em scripts/build_info.gd; esperado 'const GAME_BUILD := \"AAAA-MM-DD.N\"'." >&2
            exit 1
          fi
          TAG="build-$BUILD"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "nova=false" >> "$GITHUB_OUTPUT"
            echo ">> $TAG ja existe, nada a publicar"
            exit 0
          fi
          echo "nova=true" >> "$GITHUB_OUTPUT"
          git tag "$TAG"
          git push origin "$TAG"
          echo ">> $TAG criada"

  publicar:
    needs: decidir
    if: needs.decidir.outputs.nova == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.decidir.outputs.tag }}
