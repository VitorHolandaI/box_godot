name: tag-release

# Todo push na main vira uma Release nova, com os tres clientes compilados.
#
# A tag e a data com um contador: build-AAAA-MM-DD, e build-AAAA-MM-DD.N a
# partir da segunda do mesmo dia. Assim a Release marcada como "Latest" e sempre
# a do codigo que acabou de entrar.
#
# A tag NAO e o GAME_BUILD, e isso e de proposito: sao duas coisas diferentes.
# O GAME_BUILD e a identidade de PROTOCOLO, que o handshake compara para recusar
# cliente incompativel com o servidor; ele so sobe quando cliente e servidor
# precisam ser atualizados juntos. A tag e so o rotulo de "este binario saiu
# deste commit". Amarrar as duas fazia a Release nova nunca nascer, porque o
# GAME_BUILD fica parado por varios commits de propósito.
#
# A tag sai daqui com o GITHUB_TOKEN, e tag empurrada com esse token NAO dispara
# outro workflow (protecao do GitHub contra workflow recursivo). Por isso o
# release e CHAMADO como workflow_call em vez de esperar o gatilho de push da
# tag.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  decidir:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calcular.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # O historico inteiro com as tags, senao o contador do dia comeca do
          # zero e a criacao da tag falha por ja existir no remoto.
          fetch-depth: 0
          fetch-tags: true

      - name: Escolher a tag livre de hoje
        id: calcular
        run: |
          set -euo pipefail
          BASE="build-$(date -u +%Y-%m-%d)"
          if git rev-parse -q --verify "refs/tags/$BASE" >/dev/null; then
            # Ja houve release hoje: pega o maior sufixo numerico e soma 1.
            MAIOR=0
            for TAG_EXISTENTE in $(git tag -l "$BASE.*"); do
              SUFIXO="${TAG_EXISTENTE#"$BASE".}"
              case "$SUFIXO" in
                ''|*[!0-9]*) continue ;;
              esac
              if [ "$SUFIXO" -gt "$MAIOR" ]; then
                MAIOR="$SUFIXO"
              fi
            done
            TAG="$BASE.$((MAIOR + 1))"
          else
            TAG="$BASE"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git tag "$TAG"
          git push origin "$TAG"
          echo ">> $TAG criada (GAME_BUILD declarado: $(sed -n 's/^const GAME_BUILD := "\(.*\)"$/\1/p' scripts/build_info.gd))"

  publicar:
    needs: decidir
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.decidir.outputs.tag }}
